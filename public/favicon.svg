<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F2848" />
      <stop offset="100%" stop-color="#071426" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>
  <!-- Outer Gold Rim -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGlow)" stroke="url(#goldBorder)" stroke-width="4.5" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="#F59E0B" stroke-width="1.2" opacity="0.8" />

  <!-- Lotus Circuit Petals (Cyan Glow) -->
  <!-- Center Petal -->
  <path d="M50 20 C46 32 46 44 50 56 C54 44 54 32 50 20 Z" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" />
  <circle cx="50" cy="22" r="1.5" fill="#FCD34D" />

  <!-- Inner Side Petals -->
  <path d="M50 36 C42 30 36 38 34 50 C40 54 46 54 50 54" fill="none" stroke="#00F0FF" stroke-width="1.8" />
  <path d="M50 36 C58 30 64 38 66 50 C60 54 54 54 50 54" fill="none" stroke="#00F0FF" stroke-width="1.8" />
  <circle cx="34" cy="50" r="1.2" fill="#FCD34D" />
  <circle cx="66" cy="50" r="1.2" fill="#FCD34D" />

  <!-- Outer Wide Petals -->
  <path d="M50 44 C34 40 24 50 24 64 C34 66 44 64 50 62" fill="none" stroke="#38BDF8" stroke-width="1.8" />
  <path d="M50 44 C66 40 76 50 76 64 C66 66 56 64 50 62" fill="none" stroke="#38BDF8" stroke-width="1.8" />
  <circle cx="24" cy="64" r="1.2" fill="#FCD34D" />
  <circle cx="76" cy="64" r="1.2" fill="#FCD34D" />

  <!-- Gold base leaves -->
  <path d="M28 66 Q40 74 50 74 Q60 74 72 66" fill="none" stroke="#F59E0B" stroke-width="2" />
  <path d="M34 71 Q42 77 50 77 Q58 77 66 71" fill="none" stroke="#FBBF24" stroke-width="1.5" />

  <!-- Center Om (ॐ) in Gold -->
  <text x="50" y="52" font-family="sans-serif" font-weight="bold" font-size="13" fill="#FCD34D" text-anchor="middle" dominant-baseline="middle">ॐ</text>
</svg>
